<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mini Matrix — Auth</title>
  <link rel="icon" type="image/png" href="matrix_logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .auth-wrap { max-width: 420px; margin: 24px auto; padding: 0 16px 40px; }
    .auth-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .auth-tabs button {
      flex: 1; padding: 10px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--card); color: var(--text-soft); font-weight: 600; cursor: pointer;
    }
    .auth-tabs button.active { border-color: var(--gold); color: var(--gold); background: rgba(232,197,71,.08); }
    .auth-panel { display: none; }
    .auth-panel.active { display: block; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: .8rem; color: var(--text-soft); margin-bottom: 4px; }
    .msg { margin-top: 12px; font-size: .85rem; text-align: center; min-height: 1.2em; }
    .msg.ok { color: var(--green); }
    .msg.err { color: var(--red); }
    .code-box {
      margin-top: 12px; padding: 12px; border-radius: 12px; border: 1px dashed var(--gold);
      font-family: monospace; font-size: .85rem; word-break: break-all; direction: ltr; text-align: center;
      background: var(--bg-secondary); color: var(--gold);
    }
    .link-btn { background: none; border: none; color: var(--gold); cursor: pointer; font-size: .82rem; text-decoration: underline; }
    .full-btn { width: 100%; margin-top: 8px; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand" style="text-decoration:none;color:inherit">
        <img class="brand-logo" src="matrix_logo.png" width="44" height="44" alt="">
        <div class="brand-text"><h1>Mini Matrix</h1><p id="appSubtitle">پاسه فروشان</p></div>
      </a>
      <select id="langSelect" class="lang-select">
        <option value="fa">فارسی</option>
        <option value="en">English</option>
        <option value="ps">پښتو</option>
      </select>
    </div>
  </header>

  <div class="auth-wrap">
    <div class="auth-tabs">
      <button type="button" class="active" data-panel="login" id="tabLogin">ورود</button>
      <button type="button" data-panel="register" id="tabRegister">ثبت‌نام</button>
    </div>

    <!-- Login -->
    <div class="card auth-panel active" id="panel-login">
      <h2 id="loginTitle" style="margin-top:0;color:var(--gold)">ورود</h2>
      <div class="field"><label id="lblPhoneL">شماره واتساپ</label>
        <div class="input-wrap" dir="ltr"><input id="loginPhone" type="tel" inputmode="tel" placeholder="+93..."></div>
      </div>
      <div class="field"><label id="lblPassL">رمز عبور</label>
        <div class="input-wrap"><input id="loginPass" type="password" autocomplete="current-password"></div>
      </div>
      <button type="button" class="btn-primary full-btn" id="btnLogin">ورود</button>
      <p style="text-align:center;margin-top:12px">
        <button type="button" class="link-btn" id="goForgot">رمز را فراموش کرده‌اید؟</button>
      </p>
      <div class="msg" id="msgLogin"></div>
    </div>

    <!-- Register -->
    <div class="card auth-panel" id="panel-register">
      <h2 id="registerTitle" style="margin-top:0;color:var(--gold)">ثبت‌نام</h2>
      <div class="field"><label id="lblName">نام کامل</label>
        <div class="input-wrap"><input id="regName" type="text" autocomplete="name"></div>
      </div>
      <div class="field"><label id="lblPhoneR">شماره واتساپ</label>
        <div class="input-wrap" dir="ltr"><input id="regPhone" type="tel" inputmode="tel" placeholder="+93..."></div>
      </div>
      <div class="field"><label id="lblPassR">رمز عبور</label>
        <div class="input-wrap"><input id="regPass" type="password" autocomplete="new-password"></div>
      </div>
      <div class="field"><label id="lblRecovery">سؤال بازیابی</label>
        <div class="input-wrap"><input id="regRecovery" type="text" placeholder="..."></div>
      </div>
      <button type="button" class="btn-primary full-btn" id="btnRegister">ثبت‌نام</button>
      <div class="msg" id="msgRegister"></div>
      <div class="code-box" id="regCodeBox" style="display:none"></div>
      <a class="btn-primary full-btn" id="btnWhatsApp" style="display:none;text-align:center;text-decoration:none" target="_blank" rel="noopener">ارسال کد با واتساپ</a>
    </div>

    <!-- Activate -->
    <div class="card auth-panel" id="panel-activate">
      <h2 id="activateTitle" style="margin-top:0;color:var(--gold)">فعال‌سازی کد</h2>
      <p id="needActivate" style="color:var(--text-soft);font-size:.88rem"></p>
      <div class="field"><label id="lblCode">کد ۳۲ رقمی</label>
        <div class="input-wrap" dir="ltr"><input id="actCode" type="text" maxlength="40" autocomplete="off"></div>
      </div>
      <button type="button" class="btn-primary full-btn" id="btnActivate">فعال‌سازی</button>
      <div class="msg" id="msgActivate"></div>
    </div>

    <!-- Forgot -->
    <div class="card auth-panel" id="panel-forgot">
      <h2 id="forgotTitle" style="margin-top:0;color:var(--gold)">بازیابی رمز</h2>
      <div class="field"><label id="lblPhoneF">شماره واتساپ</label>
        <div class="input-wrap" dir="ltr"><input id="forgotPhone" type="tel"></div>
      </div>
      <div class="field"><label id="lblRecoveryF">پاسخ بازیابی</label>
        <div class="input-wrap"><input id="forgotRecovery" type="text"></div>
      </div>
      <div class="field"><label id="lblNewPass">رمز جدید</label>
        <div class="input-wrap"><input id="forgotNewPass" type="password"></div>
      </div>
      <button type="button" class="btn-primary full-btn" id="btnReset">تغییر رمز</button>
      <p style="text-align:center;margin-top:12px">
        <button type="button" class="link-btn" id="backLogin">بازگشت به ورود</button>
      </p>
      <div class="msg" id="msgForgot"></div>
    </div>
  </div>

  <script src="js/codes.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script>
  (function () {
    var lang = localStorage.getItem('mm_lang') || 'fa';
    function t(k) { return (MM_I18N[lang] || MM_I18N.fa)[k] || k; }
    function applyI18n() {
      lang = localStorage.getItem('mm_lang') || 'fa';
      var d = MM_I18N[lang] || MM_I18N.fa;
      document.documentElement.lang = d.lang;
      document.documentElement.dir = d.dir;
      document.body.dir = d.dir;
      document.getElementById('langSelect').value = lang;
      document.getElementById('tabLogin').textContent = t('loginTitle');
      document.getElementById('tabRegister').textContent = t('registerTitle');
      document.getElementById('loginTitle').textContent = t('loginTitle');
      document.getElementById('registerTitle').textContent = t('registerTitle');
      document.getElementById('activateTitle').textContent = t('activateTitle');
      document.getElementById('forgotTitle').textContent = t('forgotTitle');
      document.getElementById('btnLogin').textContent = t('btnLogin');
      document.getElementById('btnRegister').textContent = t('btnRegister');
      document.getElementById('btnActivate').textContent = t('btnActivate');
      document.getElementById('btnReset').textContent = t('btnReset');
      document.getElementById('btnWhatsApp').textContent = t('btnWhatsApp');
      document.getElementById('goForgot').textContent = t('goForgot');
      document.getElementById('backLogin').textContent = t('backLogin');
      document.getElementById('needActivate').textContent = t('needActivate');
      document.getElementById('lblPhoneL').textContent = t('phone');
      document.getElementById('lblPassL').textContent = t('password');
      document.getElementById('lblName').textContent = t('name');
      document.getElementById('lblPhoneR').textContent = t('phone');
      document.getElementById('lblPassR').textContent = t('password');
      document.getElementById('lblRecovery').textContent = t('recoveryQ');
      document.getElementById('lblCode').textContent = t('codeLabel');
      document.getElementById('lblPhoneF').textContent = t('phone');
      document.getElementById('lblRecoveryF').textContent = t('recoveryA');
      document.getElementById('lblNewPass').textContent = t('newPassword');
    }

    function showPanel(id) {
      document.querySelectorAll('.auth-panel').forEach(function (p) { p.classList.remove('active'); });
      document.querySelectorAll('.auth-tabs button').forEach(function (b) { b.classList.remove('active'); });
      var panel = document.getElementById('panel-' + id);
      if (panel) panel.classList.add('active');
      var tab = document.querySelector('.auth-tabs button[data-panel="' + id + '"]');
      if (tab) tab.classList.add('active');
    }

    document.querySelectorAll('.auth-tabs button').forEach(function (b) {
      b.addEventListener('click', function () { showPanel(b.getAttribute('data-panel')); });
    });
    document.getElementById('goForgot').onclick = function () { showPanel('forgot'); };
    document.getElementById('backLogin').onclick = function () { showPanel('login'); };

    document.getElementById('langSelect').onchange = function () {
      localStorage.setItem('mm_lang', this.value);
      applyI18n();
    };

    // if already activated session → app
    var sess = MM_AUTH.getSession();
    if (sess && sess.activated) {
      location.href = 'app.html';
      return;
    }
    if (sess && !sess.activated) showPanel('activate');

    document.getElementById('btnRegister').onclick = function () {
      var res = MM_AUTH.register({
        name: document.getElementById('regName').value,
        phone: document.getElementById('regPhone').value,
        password: document.getElementById('regPass').value,
        recovery: document.getElementById('regRecovery').value,
      });
      var msg = document.getElementById('msgRegister');
      var box = document.getElementById('regCodeBox');
      var wa = document.getElementById('btnWhatsApp');
      if (!res.ok) {
        msg.className = 'msg err';
        msg.textContent = res.error === 'exists' ? t('regExists') : res.error === 'no_codes' ? t('regNoCodes') : t('regInvalid');
        box.style.display = 'none';
        wa.style.display = 'none';
        return;
      }
      msg.className = 'msg ok';
      msg.textContent = t('regSuccess');
      box.style.display = 'block';
      box.textContent = res.code;
      wa.style.display = 'block';
      wa.href = MM_AUTH.whatsappLink(res.phone, res.code, res.name);
      // auto login session (not activated)
      MM_AUTH.login(res.phone, document.getElementById('regPass').value);
    };

    document.getElementById('btnLogin').onclick = function () {
      var res = MM_AUTH.login(
        document.getElementById('loginPhone').value,
        document.getElementById('loginPass').value
      );
      var msg = document.getElementById('msgLogin');
      if (!res.ok) {
        msg.className = 'msg err';
        msg.textContent = t('loginFail');
        return;
      }
      if (res.user.activated) location.href = 'app.html';
      else {
        msg.className = 'msg ok';
        msg.textContent = t('needActivate');
        showPanel('activate');
      }
    };

    document.getElementById('btnActivate').onclick = function () {
      var sess = MM_AUTH.getSession();
      var phone = sess ? sess.phone : document.getElementById('loginPhone').value;
      var res = MM_AUTH.activate(phone, document.getElementById('actCode').value);
      var msg = document.getElementById('msgActivate');
      if (!res.ok) {
        msg.className = 'msg err';
        msg.textContent = t('activateFail');
        return;
      }
      msg.className = 'msg ok';
      msg.textContent = t('activateOk');
      setTimeout(function () { location.href = 'app.html'; }, 600);
    };

    document.getElementById('btnReset').onclick = function () {
      var res = MM_AUTH.resetPassword(
        document.getElementById('forgotPhone').value,
        document.getElementById('forgotRecovery').value,
        document.getElementById('forgotNewPass').value
      );
      var msg = document.getElementById('msgForgot');
      if (!res.ok) {
        msg.className = 'msg err';
        msg.textContent = t('resetFail');
        return;
      }
      msg.className = 'msg ok';
      msg.textContent = t('resetOk');
    };

    var theme = localStorage.getItem('mm_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', theme);
    applyI18n();
  })();
  </script>
</body>
</html>
