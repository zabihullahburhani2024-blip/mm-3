<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a09">
  <title>Mini Matrix — Wholesale</title>
  <link rel="icon" type="image/png" href="matrix_logo.png">
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .chart-toolbar { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
    .chart-toolbar h3 { margin:0; font-size:.95rem; }
    #liveChartWrap {
      height: 240px; border-radius: 12px; overflow: hidden;
      border: 1px solid var(--border); background: var(--bg-secondary);
    }
    #liveChart { width: 100%; height: 100%; display: block; }
    .ghost-btn {
      background: var(--card); border: 1px solid var(--border); color: var(--gold);
      border-radius: 10px; padding: 6px 12px; font-size: .78rem; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <img class="brand-logo" src="matrix_logo.png" alt="Mini Matrix" width="44" height="44">
        <div class="brand-text">
          <h1>Mini Matrix</h1>
          <p id="appSubtitle">پاسه فروشان</p>
        </div>
      </div>
      <div class="header-actions">
        <select id="langSelect" class="lang-select">
          <option value="fa">فارسی</option>
          <option value="en">English</option>
          <option value="ps">پښتو</option>
        </select>
        <button type="button" class="icon-btn" id="themeToggle">🌓</button>
        <button type="button" class="ghost-btn" id="btnLogout">خروج</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="card chart-card" id="top">
      <div class="chart-toolbar">
        <h3 id="chartTitle">نمودار زنده XAU/USD</h3>
        <button type="button" class="ghost-btn" id="chartToggleBtn">پنهان کردن نمودار</button>
      </div>
      <div id="liveChartWrap">
        <canvas id="liveChart"></canvas>
      </div>

      <div class="manual-price-box">
        <p class="manual-price-hint" id="priceHint">قیمت لحظه‌ای · Twelve Data · ۸ بار در دقیقه</p>
        <div class="manual-price-wrap" dir="ltr">
          <span class="currency-sign">$</span>
          <input id="manualGoldPrice" type="number" step="0.001" placeholder="—" inputmode="decimal">
        </div>
        <p class="price-note" id="priceStatus">—</p>
        <div class="api-controls">
          <div class="api-toggle-wrap">
            <label class="api-toggle">
              <input type="checkbox" id="apiAutoToggle">
              <span class="slider"></span>
            </label>
            <span id="apiToggleLabel">خاموش</span>
          </div>
          <div class="api-quota">
            <strong id="remainingRequests">800</strong>
            <br><span id="quotaDaysInfo">Twelve Data</span>
          </div>
        </div>
      </div>
    </section>

    <section id="kabulSection">
      <h2 class="section-title" id="sectionKabul">محاسبه بازار کابل</h2>
      <div class="kabul-grid">
        <article class="card calc-card">
          <h3 id="equivTolaTitle">معادل فی توله</h3>
          <p class="calc-value" dir="ltr">$<span id="equivPrice">—</span></p>
          <p class="calc-note" dir="ltr" id="equivNote">oz ÷ <span id="divisorLabel">2.56</span></p>
        </article>
        <article class="card calc-card">
          <h3><label for="kabulPriceInput" id="kabulBuyLabel">خرید فی توله کابل ($)</label></h3>
          <div class="input-wrap" dir="ltr">
            <span class="currency-sign">$</span>
            <input id="kabulPriceInput" type="number" step="0.01" placeholder="1684.00" inputmode="decimal">
          </div>
        </article>
        <article class="card calc-card calc-card-diff" id="diffCard">
          <h3 id="diffTitle">تفاوت</h3>
          <p class="calc-value" dir="ltr"><span id="diffSign">±</span>$<span id="diffValue">—</span></p>
          <p class="calc-note" dir="ltr"><span id="diffPercent">—</span></p>
        </article>
      </div>
    </section>

    <section id="kgSection">
      <h2 class="section-title" id="sectionCalc">وزن و قیمت</h2>
      <div class="card">
        <div class="weight-grid">
          <div>
            <label for="gramInput" id="labelGram">گرم</label>
            <div class="input-wrap" dir="ltr"><input id="gramInput" type="number" step="0.001" min="0" value="1000" inputmode="decimal"></div>
          </div>
          <div>
            <label for="kgInput" id="labelKg">کیلوگرم</label>
            <div class="input-wrap" dir="ltr"><input id="kgInput" type="number" step="0.000001" min="0" inputmode="decimal"></div>
          </div>
          <div>
            <label for="tolaInput" id="labelTola">توله</label>
            <div class="input-wrap" dir="ltr"><input id="tolaInput" type="number" step="0.000001" min="0" inputmode="decimal"></div>
          </div>
          <div>
            <label for="ounceInput" id="labelOunce">اونس</label>
            <div class="input-wrap" dir="ltr"><input id="ounceInput" type="number" step="0.000001" min="0" inputmode="decimal"></div>
          </div>
        </div>
      </div>
      <div class="calc-grid" style="margin-top:12px">
        <article class="card calc-card">
          <h3 id="pricePerTolaTitle">هر توله</h3>
          <p class="calc-value" dir="ltr" id="pricePerTola">—</p>
        </article>
        <article class="card calc-card">
          <h3 id="pricePerGramTitle">هر گرم</h3>
          <p class="calc-value" dir="ltr" id="pricePerGram">—</p>
        </article>
        <article class="card calc-card">
          <h3 id="totalLiveTitle">ارزش کل</h3>
          <p class="calc-value" dir="ltr" id="totalLivePrice">—</p>
          <p class="calc-note" dir="ltr">g:<span id="kgToGram">—</span> · t:<span id="kgToTola">—</span> · oz:<span id="kgToOunce">—</span></p>
        </article>
        <article class="card calc-card calc-card-diff" id="kgDiffCard">
          <h3>Δ</h3>
          <p class="calc-value" dir="ltr"><span id="kgDiffSign">±</span>$<span id="kgDiffValue">—</span></p>
          <p class="calc-note" dir="ltr" id="kgDiffPercent">—</p>
        </article>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <button class="nav-item active" data-target="top" type="button"><span class="ni">🏠</span><span id="navHome">خانه</span></button>
      <button class="nav-item" data-target="kabulSection" type="button"><span class="ni">📈</span><span id="navPrices">قیمت‌ها</span></button>
      <button class="nav-item" data-target="kgSection" type="button"><span class="ni">🧮</span><span id="navCalc">محاسبه</span></button>
      <button class="nav-item" data-target="account" type="button" id="navAccountBtn"><span class="ni">🔑</span><span id="navActivate">حساب</span></button>
    </div>
  </nav>

  <script src="js/codes.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
